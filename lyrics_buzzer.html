<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrics Game - Player Phone</title>
    <link rel="stylesheet" href="buzzer.css">
    <style>
        #answer-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        #team-select {
            padding: 15px; font-size: 1.5rem; margin: 10px;
            border-radius: 10px; font-family: 'Poppins', sans-serif;
            width: 80%; max-width: 400px; text-align: center;
        }
        textarea {
            width: 90%;
            height: 120px;
            font-size: 1.5rem;
            padding: 10px;
            border-radius: 8px;
            background: #222;
            color: white;
            border: 2px solid var(--neon-yellow);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h1>Join Lyrics Game</h1>
        <select id="team-select">
            <option value="">Loading teams...</option>
        </select>
        <button id="btn-join-lyrics">Ready to Play</button>
    </div>

    <div id="answer-screen" class="hidden">
        <h2 id="lyrics-status-title" style="color: var(--neon-yellow);">ENTER YOUR ANSWER</h2>
        <textarea id="player-answer-input" placeholder="Name the Anime..."></textarea>
        <button id="btn-submit-answer" style="background:#10b981; width:90%; font-size:1.8rem;">Submit Answer</button>
        <div id="lockout-notice" style="color:#ef4444; font-size:1.5rem; margin-top:20px; display:none; font-weight:bold;">LOCKED OUT FOR THIS ROUND</div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="lyrics_buzzer.js"></script>
</body>
</html>
