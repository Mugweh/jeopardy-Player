<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Builder - Game CMS</title>
    <link rel="stylesheet" href="builder.css">
</head>
<body>

    <header>
        <div class="title-container">
            <label>Game Title:</label>
            <input type="text" id="game-title" value="New Jeopardy Game">
        </div>
        <div class="controls" style="display: flex; align-items: center; gap: 10px;">
            <div style="background: var(--surface); padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border-color);">
                <label style="font-size: 0.9rem; color: #ccc;">Base Points:</label>
                <input type="number" id="point-multiplier" value="100" style="width: 60px; background: #121212; color: var(--neon-yellow); border: 1px solid var(--border-color); padding: 5px; border-radius: 4px;">
                <button id="btn-apply-multiplier" class="btn-primary" style="padding: 6px 10px;">Apply</button>
            </div>
            
            <button id="btn-edit-fj" style="background-color: var(--jeopardy-blue); color: white;">Edit Final Jeopardy</button>
            
            <input type="file" id="import-file" accept=".json" style="display: none;">
            <button id="btn-import" onclick="document.getElementById('import-file').click()">Load Existing</button>
            <button id="btn-export">Export game.json</button>
        </div>
    </header>

    <main>
        <div id="builder-board">
            <!-- Board is generated via JavaScript -->
        </div>
    </main>

    <!-- Final Jeopardy Modal -->
    <div id="fj-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 100;">
        <div class="modal-content">
            <h2 style="color: var(--neon-yellow);">Edit Final Jeopardy</h2>
            
            <label>Category:</label>
            <input type="text" id="build-fj-category" placeholder="Enter FJ Category...">

            <label>Media Type:</label>
            <select id="build-fj-type">
                <option value="text">Standard Text</option>
                <option value="image">Image(s) (Comma-separate for multiple)</option>
                <option value="video">Local Video (e.g., media/clip.mp4)</option>
                <option value="audio">Local Audio (e.g., media/song.mp3)</option>
                <option value="youtube">YouTube Video</option>
                <option value="spotify">Spotify Track</option>
            </select>

            <div id="build-fj-url-container" class="hidden">
                <label>Media URL / Path:</label>
                <input type="text" id="build-fj-url" placeholder="e.g., https://youtu.be/... or images/pic.jpg">
            </div>

            <label>Prompt (The Question):</label>
            <textarea id="build-fj-prompt" rows="3" placeholder="Enter the final question..."></textarea>

            <label>Response (The Answer):</label>
            <input type="text" id="build-fj-answer" placeholder="Enter the final answer...">

            <div class="modal-actions">
                <button id="btn-cancel-fj" class="btn-secondary">Cancel</button>
                <button id="btn-save-fj" class="btn-primary">Save Final Jeopardy</button>
            </div>
        </div>
    </div>

    <!-- Edit Clue Modal -->
    <div id="clue-modal" class="hidden">
        <div class="modal-content">
            <h2 id="modal-title">Edit Clue - 100 Points</h2>
            
            <label>Media Type:</label>
            <select id="clue-type">
                <option value="text">Standard Text</option>
                <option value="image">Image(s) (Comma-separate for multiple)</option>
                <option value="video">Local Video (e.g., media/clip.mp4)</option>
                <option value="audio">Local Audio (e.g., media/song.mp3)</option>
                <option value="youtube">YouTube Video</option>
                <option value="spotify">Spotify Track</option>
            </select>

            <div id="url-container" class="hidden">
                <label>Media URL / Path:</label>
                <input type="text" id="clue-url" placeholder="e.g., https://youtu.be/... or images/pic.jpg">
            </div>

            <label>Prompt (The Question):</label>
            <textarea id="clue-prompt" rows="3" placeholder="Enter the prompt here..."></textarea>

            <label>Response (The Answer):</label>
            <input type="text" id="clue-response" placeholder="Enter the correct answer...">

            <div class="modal-actions">
                <button id="btn-cancel" class="btn-secondary">Cancel</button>
                <button id="btn-save-clue" class="btn-primary">Save Clue</button>
            </div>
        </div>
    </div>

    <script src="builder.js"></script>
</body>
</html>
