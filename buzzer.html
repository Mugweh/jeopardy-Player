<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Buzzer</title>
    <link rel="stylesheet" href="buzzer.css">
</head>
<body>
    <div id="setup-screen">
        <h1>Join Game</h1>
        <select id="team-select">
            <option value="">Loading teams...</option>
        </select>
        <button id="btn-join">Ready to Play</button>
    </div>

    <div id="buzzer-screen" class="hidden waiting">
        <div id="buzzer-status">WAITING FOR QUESTION...</div>
    </div>

    <div id="wager-screen" class="hidden waiting">
        <h2>Enter Wager</h2>
        <input type="number" id="wager-input" placeholder="0">
        <button id="btn-submit-wager">Submit Wager</button>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="buzzer.js"></script>
</body>
</html>
