<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrics Moderator – Trivia Night</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="ui.css">
    <link rel="stylesheet" href="moderator.css">
</head>
<body>

<header class="app-header">
    <div class="brand">
        <div class="logo">♪</div>
        <div>
            <h1>Lyrics Moderator</h1>
            <div class="subtitle" id="pack-title">No pack loaded</div>
        </div>
    </div>
    <div class="toolbar">
        <span id="conn-pill" class="pill"><span class="dot"></span>Connecting…</span>
        <input type="file" id="lyrics-file" accept=".json,application/json" hidden>
        <label class="btn btn-primary" for="lyrics-file">📂 Load lyrics pack</label>
        <button onclick="window.open('lyrics_player.html', '_blank')">🖥 Big screen</button>
        <button onclick="window.open('lyrics_buzzer.html', '_blank')" class="success">📱 Phone view</button>
    </div>
</header>

<main class="layout" style="grid-template-columns: minmax(0,1fr) minmax(0,1fr);">

    <section class="side-col">
        <div class="card">
            <div class="card-head">
                <span class="card-title">Round control</span>
                <span id="round-status" class="pill gold">No game loaded</span>
            </div>

            <div class="prompt-box">
                <div class="card-head" style="margin:0">
                    <div class="box-label">Lyric snippet <span>— shown on the big screen</span></div>
                    <span id="snippet-tracker" class="pill">Snippet 1 of 1</span>
                </div>
                <p id="mod-lyrics-text" class="snippet-text placeholder">Load a lyrics_game.json file to start.</p>
                <div class="button-row tight">
                    <button id="btn-prev-snippet">◀ Previous <kbd>←</kbd></button>
                    <button id="btn-next-snippet" class="primary">Next snippet <kbd>→</kbd></button>
                </div>
            </div>

            <div class="response-box">
                <div class="box-label">Correct answer <span>— moderator only</span></div>
                <p id="mod-answer-text" class="placeholder">…</p>
            </div>

            <div class="hint-stages" id="hint-stages"></div>

            <div class="button-row">
                <button id="btn-reveal-hint" class="warn">💡 Add hint <kbd>H</kbd></button>
                <button id="btn-reveal-answer" class="success">👁 Reveal answer <kbd>A</kbd></button>
            </div>
            <div class="button-row">
                <button id="btn-prev-round" class="ghost">◀ Previous round</button>
                <button id="btn-next-round" class="primary">Next round ▶ <kbd>N</kbd></button>
            </div>
            <p class="hint">Each hint lowers the round’s value by 1 point (4 → 1).</p>
        </div>
    </section>

    <section class="side-col">
        <div class="card">
            <div class="card-head"><span class="card-title">Player submissions</span></div>
            <div id="submissions-list" style="display:flex; flex-direction:column; gap:.6rem;"></div>
        </div>

        <div class="card">
            <div class="card-head">
                <span class="card-title">Teams &amp; scores</span>
                <div class="toolbar tight">
                    <label class="bonus-field"><span>Manual points</span><input type="number" id="manual-score-input" value="1" min="1"></label>
                    <button id="btn-reset-claims" class="ghost sm">📱 Reset picks</button>
                </div>
            </div>
            <div id="mod-scores-list"></div>
        </div>
    </section>
</main>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="common.js"></script>
<script src="lyrics_moderator.js"></script>
</body>
</html>
